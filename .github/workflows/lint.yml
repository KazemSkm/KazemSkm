name: Lint

on:
  push:
  pull_request:

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Run shellcheck
        run: |
          shellcheck install.sh uninstall.sh diagnose.sh
          shellcheck scripts/*.sh
      - name: Run shfmt check
        run: |
          shfmt -d -i 2 -ci install.sh uninstall.sh diagnose.sh scripts/*.sh
